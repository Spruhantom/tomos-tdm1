# TomOS Display Manager — /etc/tdm/greeter.conf
# Themes: neon (Tom OS default), dark, light, high-contrast
theme = neon
title = TOM OS
subtitle = Welcome to Tom OS
brand = TOM OS
# css = /etc/tdm/style.css     (your own GTK CSS - see docs/CUSTOMISING.md)
background = /usr/share/backgrounds/tomos/wallpaper-eclipse.png
logo = /usr/share/tdm/logo.png
default_session = Tom OS (Hyprland)
# default_user = tom
remember = true
show_users = true
show_power = true
clock_format = %H:%M
date_format = %A %e %B
