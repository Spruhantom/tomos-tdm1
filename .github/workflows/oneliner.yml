name: one-line install
# Runs the exact command from the README against the public repo and latest release.
on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"
jobs:
  oneliner:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: curl
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq curl ca-certificates; fi
          if command -v dnf >/dev/null; then dnf install -y -q curl tar gzip; fi
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm --needed curl tar gzip; fi
      - name: curl -fsSL .../install.sh | bash
        run: curl -fsSL https://raw.githubusercontent.com/Spruhantom/tomos-tdm1/main/install.sh | bash -s -- --yes 2>&1 | tee install.log
      - name: Used the prebuilt release
        run: |
          grep -q 'SHA-256 checked' install.log
          grep -q 'prebuilt tdm' install.log
          tdm --version && LD_BIND_NOW=1 tdm-greeter --version && tdm check
